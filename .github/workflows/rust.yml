name: rust

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev protobuf-compiler
      - name: cargo check
        run: cargo check --workspace --all-targets
        timeout-minutes: 30
      - name: cargo check (android JNI shim)
        run: cargo check --manifest-path rust/vpn21-core/Cargo.toml --features android-jni
        timeout-minutes: 15
      - name: cargo test (default features)
        run: cargo test --manifest-path rust/vpn21-core/Cargo.toml --lib
        timeout-minutes: 15
