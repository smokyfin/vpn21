name: vpn21
description: vpn21 — Tor-tunneled VPN client with a custom VLESS pluggable transport.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Modern UI goodies
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  animations: ^2.0.11
  flutter_animate: ^4.5.0
  # State
  flutter_riverpod: ^2.5.1
  # Utilities
  path_provider: ^2.1.3
  http: ^1.2.2
  file_picker: ^8.0.6
  mobile_scanner: ^5.2.3
  ffi: ^2.1.3
  # iOS & Android platform method channels come with flutter
  shared_preferences: ^2.3.2
  collection: ^1.18.0
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
