[workspace]
resolver = "2"
members = ["rust/vpn21-core"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MPL-2.0"
repository = "https://github.com/smokyfin/vpn21"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
parking_lot = "0.12"
once_cell = "1"
rand = "0.8"
base64 = "0.22"
bytes = "1"
url = "2"
hickory-proto = "0.24"
hickory-resolver = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
dirs = "5"
libc = "0.2"

# Core dependencies for VPN pipeline
arti-client = { version = "0.41", default-features = false, features = ["tokio", "rustls", "compression", "bridge-client", "pt-client", "geoip"] }
tor-rtcompat = { version = "0.41", default-features = false, features = ["tokio", "rustls"] }
tor-config = "0.41"

# Pluggable transport: leaf pulled from git as requested, with full default features
leaf = { git = "https://github.com/eycorsican/leaf", branch = "master" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1
